name: Release Windows

on:
  push:
    tags:
      - "v*-win"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (ex: v1.0.0-win)"
        required: true
        default: "v1.0.0-win"

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Publicar na Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Hexavante Desktop ${{ github.event.inputs.tag || github.ref_name }} (Windows)
          draft: false
          prerelease: false
          files: |
            dist/*.exe
